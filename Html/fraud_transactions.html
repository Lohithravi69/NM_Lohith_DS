<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Transactions - Merchant {{ merchant_id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <style>
        body { background-color: #f8f9fa; }
        .table-responsive { margin-top: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Fraud Detection Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                <a class="nav-link" href="{{ url_for('transactions', merchant_id=merchant_id) }}">All Transactions</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Fraud Transactions for Merchant {{ merchant_id }}</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Transaction ID</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for transaction in fraud_transactions %}
                    <tr>
                        <td>{{ transaction.TransactionID }}</td>
                        <td>{{ transaction.Date }}</td>
                        <td>
                            <a href="{{ url_for('transaction_details', transaction_id=transaction.TransactionID) }}" class="btn btn-sm btn-outline-primary">Details</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
</body>
</html>
