<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Fraud Detection - Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .btn-secondary {
            border: none;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2 class="text-center mb-4">Reset Password</h2>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label for="ResetCode" class="form-label">Reset Code</label>
                <input type="text" class="form-control" id="ResetCode" name="ResetCode" required>
            </div>
            <div class="mb-3">
                <label for="NewPassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="NewPassword" name="NewPassword" required>
            </div>
            <div class="mb-3">
                <label for="ConfirmPassword" class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" id="ConfirmPassword" name="ConfirmPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
        </form>
        <div class="text-center mt-3">
            <p class="mb-0"><a href="{{ url_for('index') }}" class="text-muted">Back to Login</a></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
</body>
</html>
