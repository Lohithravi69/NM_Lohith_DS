<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Fraud Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <style>
        body { background-color: #f8f9fa; }
        .live-feed { max-height: 600px; overflow-y: auto; }
        .alert-fraud { border-left: 5px solid #dc3545; }
        .alert-safe { border-left: 5px solid #28a745; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Fraud Detection Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                <a class="nav-link" href="{{ url_for('insights') }}">Insights</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Live Fraud Detection Feed</h2>
        <div class="live-feed" id="liveFeed">
            {% for item in live_feed %}
            <div class="alert {% if item.Result == 'Fraud Detected' %}alert-danger alert-fraud{% else %}alert-success alert-safe{% endif %}">
                <strong>Transaction ID: {{ item.TransactionID }}</strong><br>
                Amount: ${{ item.Amount }}<br>
                Result: {{ item.Result }}
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function updateLiveFeed() {
            fetch('/api/live_feed')
                .then(response => response.json())
                .then(data => {
                    const liveFeed = document.getElementById('liveFeed');
                    liveFeed.innerHTML = '';
                    data.forEach(item => {
                        const alertClass = item.Result === 'Fraud Detected' ? 'alert-danger alert-fraud' : 'alert-success alert-safe';
                        const alertDiv = document.createElement('div');
                        alertDiv.className = `alert ${alertClass}`;
                        alertDiv.innerHTML = `
                            <strong>Transaction ID: ${item.TransactionID}</strong><br>
                            Amount: $${item.Amount}<br>
                            Result: ${item.Result}
                        `;
                        liveFeed.appendChild(alertDiv);
                    });
                })
                .catch(error => console.error('Error fetching live feed:', error));
        }

        // Update every 5 seconds
        setInterval(updateLiveFeed, 5000);
    </script>
    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
</body>
</html>
